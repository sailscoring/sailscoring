description: "F2: one fleet, never split — an opening series and a medal race, with the medal race outside the discard ladder"
provenance:
  class: "TR 3.6 (mixed junior classes)"
  year: 2026
  event: "Irish Sailing Junior Champions' Cup, Fastnet Marine, Schull (NoR 8.1-8.2, 15.1-15.3)"
  si: "reference-docs:events/irish-champions-cup-junior-2026/NoR.md"
  results: "reference-docs:events/irish-champions-cup-junior-2025/results-sailwave.html"
  code: F2
  scenarios: []
  alternatives: "49er/FX/Nacra Worlds 2021 (Mussanah) and 470 Worlds 2021 (Vilamoura) both sailed a single fleet with a medal race."
runnable: true
notes: |
  The whole of this championship's structure is four clauses:

    8.1  an opening series of up to 8 races and a Medal Race
    8.2  the ten top placed boats advance to the Medal Race, provided a
         minimum of 3 opening series races have been completed
    15.1 when five or more opening series races have been completed, a boat's
         series score is the total of her race scores excluding her worst
    15.2 the Medal Race is scored double the RRS Appendix A4 points, and is
         not excluded from a boat's series score

  So the fleet is never banded: one fleet sails the opening series, and the
  only division ever made is into the medal fleet. Modelled here at reduced
  scale — 6 entries and a medal fleet of 3, against the real event's 16 and
  10 — with five opening races so the discard rule bites.

  What the structure buys, and the reason this is not a plain series with one
  weighted race: **NoR 15.1 counts opening series races**. Six races are
  scored here and only five of them reach the discard ladder, because a medal
  race neither counts toward the threshold nor may be excluded. Every boat
  drops exactly one opening score and keeps her medal score.

  s1 wins the championship on 8 without winning the medal race: her opening
  lead carries, which is what NoR 15.2's doubling is calibrated against.

  s4, s5 and s6 miss the cut and do not race again, so they have no score for
  the medal race at all (`companionRace: none`). Nothing is needed to hold
  them below the three who sailed it: the boats qualified for the deciding
  stage rank highest in the event whatever the points say. Their totals
  therefore run over five races where the qualified boats' run over six,
  which is why the two groups publish as two tables rather than one ladder —
  s4's 16 is a better number than s3's 18 and a worse result.

config:
  qualifyingFleets: [Fleet]
  discardThresholds: [{ minRaces: 5, discardCount: 1 }]
  maxFinalDiscards: 0
  medal:
    size: 3
    raceCount: 1
    multiplier: 2
    companionRace: none
    tieBreak: medal-race-then-a8

competitors:
  - "s1 Helm One"
  - "s2 Helm Two"
  - "s3 Helm Three"
  - "s4 Helm Four"
  - "s5 Helm Five"
  - "s6 Helm Six"

stages:
  - stage: qualifying
    from: 1
    fleets:
      Fleet: [s1, s2, s3, s4, s5, s6]
    races:
      - n: 1
        results:
          Fleet: [s1, s2, s3, s4, s5, s6]
      - n: 2
        results:
          Fleet: [s1, s2, s3, s4, s5, s6]
      - n: 3
        results:
          Fleet: [s2, s1, s3, s4, s5, s6]   # s1's discard comes from here
      - n: 4
        results:
          Fleet: [s1, s2, s3, s4, s5, s6]
      - n: 5
        results:
          Fleet: [s1, s2, s3, s4, s5, s6]

  - stage: medal
    from: 1
    fleets:
      Medal: [s1, s2, s3]
    races:
      - n: 1
        results:
          Medal: [s2, s1, s3]   # 1x2=2, 2x2=4, 3x2=6; s4-s6 DNC 7x2=14

expected:
  standings:
    # Five opening scores, one discarded; the medal score always counts.
    - { rank: 1, sail: s1, total: 10, net: 8, medal: true }    # 1 1 (2) 1 1 + 4
    - { rank: 2, sail: s2, total: 11, net: 9, medal: true }    # 2 (2) 1 2 2 + 2
    - { rank: 3, sail: s3, total: 21, net: 18, medal: true }   # 3 3 3 (3) 3 + 6
    #   — the cut. Six scores above it, five below.
    # No medal-race score at all: five opening scores, one dropped. Lower
    # numbers than the boats above them, and ranked below them regardless.
    - { rank: 4, sail: s4, total: 20, net: 16, medal: false }  # 4 x5, one dropped
    - { rank: 5, sail: s5, total: 25, net: 20, medal: false }
    - { rank: 6, sail: s6, total: 30, net: 24, medal: false }
