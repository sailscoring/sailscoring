description: "F1 continuous-carry: qualifying scores carry into the final total; Gold outranks Silver on points"
provenance:
  class: "ILCA 7"
  year: 2022
  event: "World Championship, Vallarta MEX"
  si: "reference-docs:events/ilca7-worlds-2022/SI.pdf"
  results: "reference-docs:events/ilca7-worlds-2022/results-sailwave.html"
  code: F1
  scenarios: []
  alternatives: "Any ILCA/Optimist/420/470 worlds; F1 is the dominant archetype."
runnable: true
notes: |
  The Addendum-C classic: one continuous low-point line across qualifying and
  final. Real Vallarta was 2 flights (Gold 63 / Silver 63), 6 Q + 6 F races,
  DNC base = largest flight + 1 = 64, "max one final-series discard" (SI 18.3.3),
  champion J-B Bernaz (FRA) 51 net. Reduced here to 2 flights of 3 over
  Q1–Q2 + F1–F2 so a scorer can verify every cell; the real parameters
  (continuous carry, per-fleet finals base, max-1-final discard) are preserved.

  Two teaching points survive the reduction:
  - Qualifying scores stay in the total (b1's two Q wins are half his line).
  - Gold outranks Silver regardless of points: y2 (Gold, net 6) is ranked
    ABOVE b2 (Silver, net 5).

  Worked line (4 races, 1 discard at 4; the discarded score in parens):
    Gold   b1  1  1 (2) 1  -> total 5, net 3
    Gold   y1  1 (2) 1  2  -> total 6, net 4
    Gold   y2  2  1 (3) 3  -> total 9, net 6
    Silver b2 (2) 2  1  2  -> total 7, net 5
    Silver y3 (3) 3  2  1  -> total 9, net 6
    Silver b3 (3) 3  3  3  -> total 12, net 9

config:
  qualifyingFleets: [Yellow, Blue]
  finalFleets: [Gold, Silver]
  discardThresholds:
    - minRaces: 4
      discardCount: 1
  maxFinalDiscards: 1

competitors:
  - "y1 Helm Y1"
  - "y2 Helm Y2"
  - "y3 Helm Y3"
  - "b1 Helm B1"
  - "b2 Helm B2"
  - "b3 Helm B3"

stages:
  - stage: qualifying
    from: 1
    fleets:
      Yellow: [y1, y2, y3]
      Blue: [b1, b2, b3]
    races:
      - n: 1
        results:
          Yellow: [y1, y2, y3]
          Blue: [b1, b2, b3]
      - n: 2
        results:
          Yellow: [y2, y1, y3]
          Blue: [b1, b2, b3]

  - stage: final
    from: 1
    # Split of the Q1–Q2 ranking (b1 2, y1 3, y2 3, b2 4, y3 6, b3 6) into
    # equal blocks: Gold = top 3, Silver = next 3.
    fleets:
      Gold: [b1, y1, y2]
      Silver: [b2, y3, b3]
    races:
      - n: 1
        results:
          Gold: [y1, b1, y2]
          Silver: [b2, y3, b3]
      - n: 2
        results:
          Gold: [b1, y1, y2]
          Silver: [y3, b2, b3]

expected:
  standings:
    - { rank: 1, sail: b1, total: 5, net: 3, fleet: Gold }
    - { rank: 2, sail: y1, total: 6, net: 4, fleet: Gold }
    - { rank: 3, sail: y2, total: 9, net: 6, fleet: Gold }
    - { rank: 4, sail: b2, total: 7, net: 5, fleet: Silver }
    - { rank: 5, sail: y3, total: 9, net: 6, fleet: Silver }
    - { rank: 6, sail: b3, total: 12, net: 9, fleet: Silver }
