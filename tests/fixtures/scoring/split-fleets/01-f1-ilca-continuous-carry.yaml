description: "F1 continuous carry: fleets seeded by ranking, qualifying scores carry into the final total, Gold outranks Silver"
provenance:
  class: "ILCA 7"
  year: 2022
  event: "World Championship, Vallarta MEX"
  si: "reference-docs:events/ilca7-worlds-2022/SI.pdf"
  results: "reference-docs:events/ilca7-worlds-2022/results-sailwave.html"
  code: F1
  scenarios: []
  alternatives: "Any ILCA/Optimist/420/470 worlds; F1 is the dominant archetype."
runnable: true
notes: |
  The Addendum-C classic, with the assignment computed rather than declared:
  - Round 1 is SEEDED from the entry ranking — competitors are listed in seed
    order (s1 best), and the rank pattern (down the flight list and back)
    spreads ability across flights, so s1
    and s2 land in DIFFERENT flights (Yellow gets s1, s4, s5; Blue gets s2,
    s3, s6). This is the point of seeding — consecutive seeds never share a
    flight — and `expectedFleets` asserts it.
  - The final split is derived from the qualifying ranking: Gold = the top
    block, Silver = the rest.

  Real Vallarta was 2 flights (Gold 63 / Silver 63), 6 Q + 6 F races, DNC base
  = largest flight + 1 = 64, "max one final-series discard" (SI 18.3.3),
  champion J-B Bernaz (FRA) 51 net. Reduced here to 2 flights of 3 over
  Q1-Q2 + F1-F2 so a scorer can verify every cell.

  Teaching points: qualifying scores stay in the total (continuous carry),
  and Gold outranks Silver regardless of points. `expected` verified against
  the engine.

config:
  qualifyingFleets: [Yellow, Blue]
  finalFleets: [Gold, Silver]
  discardThresholds:
    - minRaces: 4
      discardCount: 1
  maxFinalDiscards: 1

# Listed in seed order (s1 = top seed). Round 1 assigns by this order.
competitors:
  - "s1 Seed 1"
  - "s2 Seed 2"
  - "s3 Seed 3"
  - "s4 Seed 4"
  - "s5 Seed 5"
  - "s6 Seed 6"

stages:
  - stage: qualifying
    from: 1
    assign: { seed: entry-order }
    expectedFleets:
      Yellow: [s1, s4, s5]
      Blue: [s2, s3, s6]
    races:
      - n: 1
        results:
          Yellow: [s1, s4, s5]
          Blue: [s2, s3, s6]
      - n: 2
        results:
          Yellow: [s4, s1, s5]
          Blue: [s2, s3, s6]

  - stage: final
    from: 1
    assign: { split: true }
    expectedFleets:
      Gold: [s1, s2, s4]
      Silver: [s3, s5, s6]
    races:
      - n: 1
        results:
          Gold: [s1, s2, s4]
          Silver: [s3, s5, s6]
      - n: 2
        results:
          Gold: [s2, s1, s4]
          Silver: [s5, s3, s6]

expected:
  standings:
    - { rank: 1, sail: s2, total: 5, net: 3, fleet: Gold }
    - { rank: 2, sail: s1, total: 6, net: 4, fleet: Gold }
    - { rank: 3, sail: s4, total: 9, net: 6, fleet: Gold }
    - { rank: 4, sail: s3, total: 7, net: 5, fleet: Silver }
    - { rank: 5, sail: s5, total: 9, net: 6, fleet: Silver }
    - { rank: 6, sail: s6, total: 12, net: 9, fleet: Silver }
