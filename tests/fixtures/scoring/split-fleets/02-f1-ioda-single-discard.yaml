description: "F1 IODA: exactly one discard, unlocked at 5 races — there is never a second"
provenance:
  class: "Optimist"
  year: 2026
  event: "IODA World Championship, Tangier MAR"
  si: "reference-docs:events/optimist-worlds-2026/SI.pdf"
  results: "reference-docs:events/optimist-worlds-2026/results-sailti.html"
  code: F1
  scenarios: []
  alternatives: "Every IODA Worlds 2021–2026; the single-discard rule is clause-stable."
runnable: true
notes: |
  IODA's discard rule differs from ILCA's: one discard is unlocked at 5 races
  and there is NEVER a second, even at 12 (SI 19.3/19.4, verbatim 2021–2026;
  the 2026 Tangier winner discarded one score of twelve). The rule lives
  entirely in `discardThresholds`: a single {minRaces: 5} entry and no 10→2
  tier — contrast fixture 01's ILCA ladder. Real IODA is 4 flights →
  Gold/Silver/Bronze/Emerald; reduced here to 2 flights over 4 Q + 2 F races
  (6 total, so the single discard is active). A qualifying DNC scores
  largest-flight + 1 = 4 (y3, race 3). `expected` verified against the engine.

  A fleet-boundary tie at the split (worth understanding): after Q1–Q4, no
  discard yet (threshold is 5 races), y2 and b2 are tied on 8 points with
  IDENTICAL race scores (2,2,2,2 each). RRS A8 cannot separate them — A8.1
  (best scores first) and A8.2 (last race, then next-to-last…) both stay tied
  on identical scores. The tie sits exactly on the Gold/Silver boundary (top 3
  go Gold: y1 and b1 on 4, then one of y2/b2 on 8). It is broken by ENTRY
  ORDER — y2 was entered before b2 — so y2 takes the last Gold place and b2
  drops to Silver. That is the SIs' "if still tied after RRS A8, order by the
  registration/seeding order" rule (the design's `reassignmentTieOrder:
  a8-then-entry-order`; the other real variant is LE's deliberate fleet-order
  scatter). It is also why b2 finishes with the BETTER net (9) than y2 (11)
  yet ranks below her: y2 is Gold, b2 is Silver, and Gold beats Silver
  regardless of points.

config:
  qualifyingFleets: [Yellow, Blue]
  finalFleets: [Gold, Silver]
  discardThresholds:
    - minRaces: 5
      discardCount: 1
  maxFinalDiscards: 1

competitors:
  - "y1 Helm Y1"
  - "y2 Helm Y2"
  - "y3 Helm Y3"
  - "b1 Helm B1"
  - "b2 Helm B2"
  - "b3 Helm B3"

stages:
  - stage: qualifying
    from: 1
    fleets:
      Yellow: [y1, y2, y3]
      Blue: [b1, b2, b3]
    races:
      - n: 1
        results:
          Yellow: [y1, y2, y3]
          Blue: [b1, b2, b3]
      - n: 2
        results:
          Yellow: [y1, y2, y3]
          Blue: [b1, b2, b3]
      - n: 3
        results:
          Yellow: [y1, y2]        # y3 absent -> DNC = largest flight (3) + 1 = 4
          Blue: [b1, b2, b3]
      - n: 4
        results:
          Yellow: [y1, y2, y3]
          Blue: [b1, b2, b3]

  - stage: final
    from: 1
    # Split of the Q1–Q4 ranking (y1 4, b1 4, y2 8, b2 8, b3 12, y3 13).
    assign: { split: true }
    expectedFleets:
      Gold: [y1, b1, y2]
      Silver: [b2, b3, y3]
    races:
      - n: 1
        results:
          Gold: [y1, b1, y2]
          Silver: [b2, b3, y3]
      - n: 2
        results:
          Gold: [b1, y1, y2]
          Silver: [b3, b2, y3]

expected:
  # y3's discard falls on the DNC (4 = largest flight 3 + 1); y2 (Gold, net 11)
  # still outranks b2 (Silver, net 9) — fleet band beats points.
  standings:
    - { rank: 1, sail: y1, total: 7, net: 5, fleet: Gold }
    - { rank: 2, sail: b1, total: 7, net: 5, fleet: Gold }
    - { rank: 3, sail: y2, total: 14, net: 11, fleet: Gold }
    - { rank: 4, sail: b2, total: 11, net: 9, fleet: Silver }
    - { rank: 5, sail: b3, total: 15, net: 12, fleet: Silver }
    - { rank: 6, sail: y3, total: 19, net: 15, fleet: Silver }
