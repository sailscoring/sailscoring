description: "D5 unequal final counts: Gold sails more final races than Silver — both score correctly"
provenance:
  class: "ILCA 7"
  year: 2022
  event: "World Championship, Vallarta MEX"
  si: "reference-docs:events/ilca7-worlds-2022/SI.pdf"
  results: "reference-docs:events/ilca7-worlds-2022/results-sailwave.html"
  code: F1
  scenarios: [D5]
  alternatives: "ILCA 2024 Adelaide (Gold 11 / Silver-Bronze 10); 29er 2026 (9/9/6/4/5/5); Optimist 2021/2025."
runnable: true
notes: |
  "Different final-series fleets need not have completed the same number of
  races" (Addendum A3.5). At Vallarta the Gold fleet completed 12 races and
  Silver 11 — unequal by design, not a fault. Each fleet's total simply counts
  the races it sailed; the fleet band (Gold above Silver) orders the two.

  Modelled as 2 flights of 3 -> Gold(3)/Silver(3), then Gold sails F1 AND F2
  while Silver sails only F1. No series discard, so the effect is visible in
  the raw totals: Gold boats carry three race scores, Silver boats two.
  `expected` verified against the engine.

config:
  qualifyingFleets: [Yellow, Blue]
  finalFleets: [Gold, Silver]
  discardThresholds: []
  maxFinalDiscards: 0

competitors:
  - "y1 Helm Y1"
  - "y2 Helm Y2"
  - "y3 Helm Y3"
  - "b1 Helm B1"
  - "b2 Helm B2"
  - "b3 Helm B3"

stages:
  - stage: qualifying
    from: 1
    fleets:
      Yellow: [y1, y2, y3]
      Blue: [b1, b2, b3]
    races:
      - n: 1
        results:
          Yellow: [y1, y2, y3]
          Blue: [b1, b2, b3]

  - stage: final
    from: 1
    assign: { split: true }
    expectedFleets:
      Gold: [y1, b1, y2]
      Silver: [b2, y3, b3]
    races:
      - n: 1
        results:
          Gold: [y1, b1, y2]
          Silver: [b2, y3, b3]
      - n: 2
        results:
          Gold: [b1, y1, y2]        # only Gold sails F2; Silver has no F2 race

expected:
  standings:
    # Gold boats carry 3 race scores (Q1,F1,F2); Silver boats carry 2 (Q1,F1).
    - { rank: 1, sail: y1, total: 4, net: 4, fleet: Gold }
    - { rank: 2, sail: b1, total: 4, net: 4, fleet: Gold }
    - { rank: 3, sail: y2, total: 8, net: 8, fleet: Gold }
    - { rank: 4, sail: b2, total: 3, net: 3, fleet: Silver }
    - { rank: 5, sail: y3, total: 5, net: 5, fleet: Silver }
    - { rank: 6, sail: b3, total: 6, net: 6, fleet: Silver }
