description: "Frozen rounds: a protest decided after the next round is drawn re-scores the standings but never re-deals the fleets"
provenance:
  class: "ILCA (procedure common to all Appendix-C-style championships)"
  year: 2024
  event: "Procedure per ILCA World Championship SIs (Adelaide wording)"
  si: "reference-docs:events/ilca7-worlds-2024/SI-Amendment-1.md"
  results: "n/a — procedural fixture; see notes"
  code: F1
  scenarios: [D10]
  alternatives: "Every class SI surveyed pins assignments at publication; none re-deal on a later protest outcome."
runnable: true
notes: |
  Championship SIs pin each day's fleet assignments when published: a protest
  or redress decided that evening changes scores, and future reassignments
  use the corrected ranking, but an assignment already made stands. This
  fixture proves the engine's frozen-round property end to end.

  Timeline: Round 1 (Q1) is seeded by sail number; Round 2 (Q2) is reassigned
  from the ranking after Q1. THEN a protest disqualifies 104 from Q1 — the
  amendment below replaces the Q1 Yellow sheet after both rounds are frozen.

  Had the Round 2 assignment been recomputed from the amended Q1 ranking
  (101, 102, 103, 105, 106, 107, 108, 104), Yellow would be
  101/105/106/104 — but the committed assignment used the pre-protest
  ranking (101…108 in sail order: rank-pattern ties resolved by entry order),
  giving Yellow 101/104/105/108, and that is what expectedFleets asserts.

  The standings DO use the amended score: 104 carries DSQ = largest fleet
  4 + 1 = 5 from Q1. Hand-verification (no discards):
    103 wins on 3 (Q1 2, Q2 1).
    101, 105, 108 all on 4: A8.1 score lists [1,3] beats [2,2], so 105 is
    behind both; 101 vs 108 tie on A8.1 [1,3] and break on A8.2 (last race:
    108 scored 1, 101 scored 3).
    106 (3+3) vs 107 (4+2) on 6: A8.1 [2,4] beats [3,3] — 107 ahead.
    104 last on 5 + 4 = 9.

config:
  qualifyingFleets: [Yellow, Blue]
  discardThresholds: []
  maxFinalDiscards: 0

competitors:
  - "101 Helm A"
  - "102 Helm B"
  - "103 Helm C"
  - "104 Helm D"
  - "105 Helm E"
  - "106 Helm F"
  - "107 Helm G"
  - "108 Helm H"

stages:
  - stage: qualifying
    from: 1
    assign:
      seed: sail-number
    expectedFleets:
      Yellow: [101, 104, 105, 108]
      Blue: [102, 103, 106, 107]
    races:
      - n: 1
        results:
          Yellow: [101, 104, 105, 108]
          Blue: [102, 103, 106, 107]
  - stage: qualifying
    from: 2
    assign:
      reassignAfter: 1
    # Computed from the PRE-protest Q1 ranking and frozen. The amended
    # ranking would give Yellow 101/105/106/104 — the assertion below is
    # the frozen-round property.
    expectedFleets:
      Yellow: [101, 104, 105, 108]
      Blue: [102, 103, 106, 107]
    races:
      - n: 2
        results:
          Yellow: [108, 105, 101, 104]
          Blue: [103, 107, 106, 102]

# Decided after Round 2 was committed: 104 is disqualified from Q1.
amendments:
  - stage: qualifying
    race: 1
    fleet: Yellow
    results: [101, 105, 108, "104 DSQ"]

expected:
  standings:
    - { rank: 1, sail: "103", total: 3, net: 3 }
    - { rank: 2, sail: "108", total: 4, net: 4 }  # A8.2 over 101: won the last race
    - { rank: 3, sail: "101", total: 4, net: 4 }
    - { rank: 4, sail: "105", total: 4, net: 4 }  # A8.1: [2,2] behind [1,3]
    - { rank: 5, sail: "102", total: 5, net: 5 }
    - { rank: 6, sail: "107", total: 6, net: 6 }  # A8.1: [2,4] beats [3,3]
    - { rank: 7, sail: "106", total: 6, net: 6 }
    - { rank: 8, sail: "104", total: 9, net: 9 }  # Q1 DSQ = largest fleet 4 + 1
