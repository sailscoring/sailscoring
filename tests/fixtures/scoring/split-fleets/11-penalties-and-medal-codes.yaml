description: "Penalties on finishers (SCP/DPI): tenth-of-a-point rounding, the DNF cap, and a medal-race code doubled with the rest of the race"
provenance:
  class: "ILCA 7"
  year: 2024
  event: "World Championship, Adelaide AUS (SI 15.1.1 SCP 10%; SI 18.6 medal doubling)"
  si: "reference-docs:events/ilca7-worlds-2024/SI-Amendment-1.md"
  results: "reference-docs:events/ilca7-worlds-2024/results-sailwave.html"
  code: F2
  scenarios: []
  alternatives: "Real Adelaide results carry '(17.0 30%)' SCP cells and check-in DPI-style 1-point penalties."
runnable: true
notes: |
  Two rules the real results exercise constantly:

  - SCP adds a percentage of the race's DNF score on top of the finish, and
    RRS 44.3(c) is exact about both ends of it: the percentage is "rounded to
    the nearest tenth of a point (0.05 rounded upward)", and "the penalty
    shall not cause the boat's score to be worse than the score for Did Not
    Finish". Q1 Yellow exercises both against a DNF score of 4:
      * y2 finishes 2nd with a 30% SCP -> 2 + 1.2 = 3.2. A whole-point
        rounding would say 3, and a tenth of a point decides championships.
      * y3 finishes 3rd with a 50% SCP -> 3 + 2 = 5, which is worse than the
        DNF score, so she is scored 4.
    Q2 adds the unremarkable case: y1 1st with a 50% SCP -> 1 + 2 = 3. DPI
    adds stated points: b1 finishes 1st in F1 with DPI 1 -> 2.
  - Medal doubling reaches the code scores too. The SI says a boat's score
    "shall be double the number of points specified in RRS Appendix A4", and
    A4 is a table of FINISHING PLACE to points; A5.2 scores a boat who did
    not sail the course "points for the finishing place one more than the
    number of boats entered", which is a place that A4 turns into points. So
    b1 wins the medal race (1 x2 = 2) and y1, BFD, is scored the medal-fleet
    base doubled (2 boats + 1 = 3, x2 = 6).
    A stated [SP] is still added after the doubling and is not itself doubled
    (SI 18.6: "with any [SP] then added"); a percentage penalty is a
    percentage of this race's DNF score, which is the doubled one.

  No discards (threshold empty) so every cell is visible. `expected` verified
  against the engine.

config:
  qualifyingFleets: [Yellow, Blue]
  finalFleets: [Gold, Silver]
  discardThresholds: []
  medal:
    size: 2
    multiplier: 2

competitors:
  - "y1 Helm Y1"
  - "y2 Helm Y2"
  - "y3 Helm Y3"
  - "b1 Helm B1"
  - "b2 Helm B2"
  - "b3 Helm B3"

stages:
  - stage: qualifying
    from: 1
    fleets:
      Yellow: [y1, y2, y3]
      Blue: [b1, b2, b3]
    races:
      - n: 1
        results:
          Yellow: [y1, "y2 SCP 30", "y3 SCP 50"]   # 1 | 2+1.2=3.2 | 3+2=5 capped to DNF 4
          Blue: [b1, b2, b3]
      - n: 2
        results:
          Yellow: ["y1 SCP 50", y2, y3]   # y1 1st + 50% of DNC base 4 = 3
          Blue: [b1, b2, b3]

  - stage: final
    from: 1
    assign: { split: true }
    expectedFleets:
      Gold: [b1, b2, y1]
      Silver: [b3, y2, y3]
    races:
      - n: 1
        results:
          Gold: ["b1 DPI 1", y1, b2]      # b1 1st + 1 DPI point = 2
          Silver: [y2, b3, y3]
      # The one more race the boats outside the medal fleet sail, alongside
      # the medal race. b1 and y1 are in the medal fleet and are not in it;
      # Silver's was scheduled too and, as at Adelaide, never ran.
      - n: 2
        results:
          Gold: [b2]                      # first = medal size 2 + 1 = 3

  - stage: medal
    from: 1
    fleets:
      Medal: [b1, y1]
    medalAfter: 1
    races:
      - n: 1
        results:
          Medal: [b1, "y1 BFD"]           # b1 1x2=2; y1 BFD = base 3 x2 = 6

expected:
  standings:
    - { rank: 1, sail: b1, total: 6, net: 6, fleet: Gold, medal: true }
    - { rank: 2, sail: y1, total: 12, net: 12, fleet: Gold, medal: true }
    - { rank: 3, sail: b2, total: 10, net: 10, fleet: Gold, medal: false }
    - { rank: 4, sail: y2, total: 6.2, net: 6.2, fleet: Silver }
    - { rank: 5, sail: b3, total: 8, net: 8, fleet: Silver }
    - { rank: 6, sail: y3, total: 10, net: 10, fleet: Silver }
