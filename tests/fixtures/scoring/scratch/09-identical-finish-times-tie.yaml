  - sailNumber: "3"
    name: "Charlie"
  - sailNumber: "4"
    name: "Anna"
  - sailNumber: "5"
    name: "Echo"

races:
  - number: 1
    startTime: "13:30:00"
    finishes:
      - sailor: "1"
        position: 1
        finishTime: "14:58:12"
      - sailor: "2"
        position: 2
        finishTime: "15:00:41"
      # Charlie and Anna crossed together — the committee boat wrote one time
      # against both, which is what a dead heat looks like on a paper sheet.
      - sailor: "3"
        position: 3
        finishTime: "15:01:06"
      - sailor: "4"
        position: 4
        finishTime: "15:01:06"
      - sailor: "5"
        position: 5
        finishTime: "15:04:20"

# Race points: 1, 2, 3.5, 3.5, 5 — the two tied boats take the average of the
# places they occupy, and Echo is 5th, not 4th.
