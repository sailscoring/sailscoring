description: "YTC — Mayo Sailing Club Cruisers YTC, Spring Series 2026 (HalSail parity)"
rrs_notes: >
  YTC (RYA Yacht Time Correction) is time-on-time with the Portsmouth
  yardstick's maths: corrected time = elapsed × 1000 / YTC, so a lower
  number is a faster boat. This is Mayo Sailing Club's 2026 Spring Series
  for its Cruisers YTC fleet, as published on HalSail
  (halsail.com/Result/Public/96252): seven boats, five races, every number
  equal to the spinnaker YTC on the boat's RORC certificate. Corrected
  times round half-up to the second; all 25 match HalSail's exactly.
  Coded finishes score the boats that came to the start + 1 — DNC
  included, which is not RRS A5.3 (there DNC scores the entries + 1), so
  the series changes DNC to score as DNF. One discard.

series:
  discardThresholds:
    - minRaces: 5
      discardCount: 1
  dnfScoring: startingArea
  # Mayo scores DNC as the boats that came to the start + 1, like DNF.
  scoringCodes:
    - code: DNC
      kind: replace
      rule: { type: sameAs, code: DNF }
      discardable: true

fleet:
  scoringSystem: ytc

competitors:
  - { sailNumber: "3062", name: "Crozz", ytcNumber: 920 }
  - { sailNumber: "2552", name: "Fusion", ytcNumber: 943 }
