description: "IRC — the same race recorded as elapsed times scores identically"
rrs_notes: "CT = ET × TCC. How the elapsed time reached the scorer is not a scoring input."

notes: |
  Fixture 01 is this race recorded off the committee boat's clock: a time of
  day per boat, elapsed time being the difference from the gun. Here the same
  three boats are recorded the way a finish boat with a stopwatch records
  them — an elapsed time per boat and no time of day at all — and the race
  must score the same.

  Boat 1: elapsed 1:00:00 = 3600 s   CT = 3600 × 1.05 = 3780.00 → 3780  → 3rd
  Boat 2: elapsed 1:07:58 = 4078 s   CT = 4078 × 0.88 = 3588.64 → 3589  → 1st
  Boat 3: elapsed 1:03:30 = 3810 s   CT = 3810 × 0.95 = 3619.50 → 3620  → 2nd

  The gun is still recorded. Nothing here is corrected against it — the
  elapsed times are what they are — but a fleet with no start does not race
  under handicap at all, so the start is what puts these boats in the race.

