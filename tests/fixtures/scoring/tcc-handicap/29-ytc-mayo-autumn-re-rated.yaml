description: "YTC — a reissued certificate mid-series (Mayo Autumn Series 2026, HalSail parity)"
rrs_notes: >
  Mayo Sailing Club's 2026 Autumn Series for its Cruisers YTC fleet, as
  published on HalSail (halsail.com/Result/Public/96884). Crozz sailed
  races 1–3 on YTC 920 and races 4–6 on 941, the number on its reissued
  RORC certificate. Crozz carries its current number, 941; races 1–3 are
  pinned to 920 with a per-race rating override on the ytcNumber field,
  the same mechanism as a new IRC certificate. The override decides race 1:
  on 941 Crozz would correct to 0:32:53 and win it, not finish third on
  0:33:38. Every corrected time
  matches HalSail's to the second. Freebird and Elixir, who came to no
  race, finish level on 29 and stay tied (HalSail's "6=").

series:
  discardThresholds:
    - minRaces: 5
      discardCount: 1
  dnfScoring: startingArea
  # Mayo scores DNC as the boats that came to the start + 1, like DNF.
  scoringCodes:
    - code: DNC
      kind: replace
      rule: { type: sameAs, code: DNF }
      discardable: true

fleet:
  scoringSystem: ytc

competitors:
  - { sailNumber: "2552", name: "Fusion", ytcNumber: 943 }
  - { sailNumber: "930", name: "Uforia", ytcNumber: 932 }
