description: "Mixed laps — fixed TCF, two laps of three, and a row with no count"
rrs_notes: "Not an RRS matter: average-lap racing applies to any time-on-time correction, not only PY. CT = ET × (full-course laps ÷ laps sailed) × TCF, rounded once."
notes: |
  A fixed-TCF fleet (a club handicap). The full course is 3 laps, the most
  any boat sailed. Bravo's row carries no lap count, which means the full
  course; Charlie sailed 2 laps of the 3.

  Start 14:00:00.

  Alpha    TCF 1.000  3 laps   ET 3600 s                      CT = 3600 × 1.000            = 3600
  Bravo    TCF 0.900  (full)   ET 3900 s                      CT = 3900 × 0.900            = 3510
  Charlie  TCF 0.850  2 laps   ET 2827 s → × 3/2 = 4240.5 s   CT = 4240.5 × 0.850 = 3604.43 → 3604

  Charlie's full-course time has half a second in it. The corrected time is
  rounded once, after the rating is applied; rounding the scaled elapsed time
  first (4241 s) would give 3604.85 → 3605. Sailwave scales and corrects in
  one step for the same reason ("there is no need for fractional seconds").

