description: "Primary and secondary IRC certificates race by race — ISORA 2026, Crackajack, IRC Class 1"
rrs_notes: >
  ISORA NoR 6.2–6.5: a boat with two IRC certificates declares, race by race,
  which it races on; without a declaration the primary applies. Crackajack
  holds a primary at TCC 1.013 and a secondary at 1.014, and declared the
  secondary for the Welsh coastal races.
notes: |
  Four races of ISORA's 2026 IRC Class 1 season: 01CW1, 03CW2, 13O6 (the
  K2Q) and 16CW5, each scored CHIPS3 × its weight, every race counting.
  Crackajack keeps both certificates. 01CW1 and 13O6 score on the primary,
  1.013; 03CW2 and 16CW5 are declared on the secondary, 1.014, and score on
  it. Two other boats raced 13O6 on a different TCC than the rest of their
  season; those are typed per-race ratings, as before.

  Every elapsed time, rating, rank and corrected time is the one ISORA
  published in its IRC Class 1 race tables, and so is each weighted race
  score in the standings. The per-race points below are CHIPS3 before the
  race's weight.

series:
  discardThresholds: []
  dnfScoring: seriesEntries
  pointsSystem: highPoint
  highPointFormula: chips3
  scoringCodes:
    - { code: DNF, kind: replace, rule: { type: fixedPoints, points: 15 }, discardable: true }
    - { code: DTP, description: "Declared to race, did not race (NoR 13.2)", kind: replace, rule: { type: fixedPoints, points: 8 }, discardable: true, countsInFleetSize: true }

fleet:
  scoringSystem: irc

competitors:
  - { sailNumber: "IRL 53196", name: "ReQuest", ircTcc: 1.022 }
  - { sailNumber: "GBR 723R", name: "Hijacker", ircTcc: 1.029 }
  - { sailNumber: "GBR 6939R", name: "Finally", ircTcc: 1.019 }
