description: "IRC — a race timed to the millisecond is corrected to the millisecond"
rrs_notes: "ORC rule 401.2 takes times to whole seconds, which is what a clock or a stopwatch records. A race timed electronically was not recorded that way, and rounding it to the second would discard the only evidence of who was ahead."

notes: |
  Electronic race management measures to the millisecond, so an imported
  elapsed time arrives with a fractional part. The fraction is the
  measurement, so it is kept — through the correction as well as in storage —
  and the corrected time is rounded to the millisecond rather than to the
  second.

  Boat 1: elapsed 3599.500 s   CT = 3599.500 × 1.05 = 3779.475  → 3rd
  Boat 2: elapsed 4077.600 s   CT = 4077.600 × 0.88 = 3588.288  → 1st
  Boat 3: elapsed 3810.400 s   CT = 3810.400 × 0.95 = 3619.880  → 2nd

  A race whose finishes are all whole seconds is corrected to the second
  exactly as before — the fraction on the sheet is what decides, and no race
  recorded off a clock or a stopwatch has one. Fixture 20 is the pair of
  races that shows the difference.

  The three boats are otherwise fixture 01's, so the ranking is unchanged and
  the fraction is the only thing under test.

