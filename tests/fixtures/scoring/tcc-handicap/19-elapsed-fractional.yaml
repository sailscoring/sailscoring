description: "IRC — a recorded elapsed time with a fractional part rounds half-up before correction"
rrs_notes: "ORC rule 401.2: times are taken to whole seconds. The engine rounds half-up, as it does every other elapsed time."

notes: |
  Electronic race management measures to the millisecond, so an imported
  elapsed time arrives with a fractional part. The fraction is kept as
  recorded — it is the measurement — but the corrected time is worked from
  whole seconds, so the elapsed time rounds half-up on the way into the
  calculation.

  Boat 1: elapsed 3599.500 s → 3600   CT = 3600 × 1.05 = 3780.00 → 3780  → 3rd
  Boat 2: elapsed 4077.600 s → 4078   CT = 4078 × 0.88 = 3588.64 → 3589  → 1st
  Boat 3: elapsed 3810.400 s → 3810   CT = 3810 × 0.95 = 3619.50 → 3620  → 2nd

  Boat 1 is the case that matters: exactly half a second rounds up, not down.
  The three boats are otherwise fixture 01's, so the ranking is unchanged and
  the fraction is the only thing under test.

