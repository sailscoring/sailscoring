description: "A 30% cut in a boat's own points — ISORA's 2026 finish-declaration penalty"
notes: |
  ISORA's 2026 notice of race (8.3, Amendment 3) and sailing instructions: a
  boat that doesn't declare her finish on the CrewManager app takes "a 30%
  point reduction penalty for that race". The series has a code of its own
  for it, CMP: the boat loses 30% of her points.

  No published ISORA race carries the penalty yet, so this is a made-up race
  the size and weight of 2026's race 06O1: 20 boats, weight 1.1, DNF a fixed
  15. Every boat rates 1.000, so Boat 3 is 3rd.

  Boat 3: CHIPS3(3, 20) = 90.229; less 30% = 63.160; × 1.1 = 69.5. She
  keeps her place in the race, and the boats behind her keep their scores.

  Boat 19: 17.154; less 30% = 12.008; × 1.1 = 13.2. That is fewer points
  than a DNF's 16.5. The 30% is the notice of race's own penalty, not a
  rule 44.3(c) scoring penalty, so DNF's score doesn't bound it.

series:
  discardThresholds: []
  dnfScoring: seriesEntries
  pointsSystem: highPoint
  highPointFormula: chips3
  scoringCodes:
    - { code: DNF, kind: replace, rule: { type: fixedPoints, points: 15 }, discardable: true }
    - { code: CMP, description: "Finish not declared on the CrewManager app (NoR 8.3)", kind: add, rule: { type: reducePercent, percent: 30 }, discardable: true }

