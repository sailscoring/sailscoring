description: "CHIPS3 with a DNS left out of the fleet size — ISORA 2024, race 04CW2"
notes: |
  In 2024 ISORA's fleet size counted the boats that started: Sailwave's
  "starters", which is CHIPS3's own definition of n. Six finishers and a
  DNS make n = 6, not 7, and the DNS scores 0.

  The race is weighted 0.8. Jackknife wins: CHIPS3(1, 6) = 93.84, × 0.8 =
  75.07, rounded once to 75.1. ISORA 2024 scored a retirement a fixed 10
  points; no boat retired here.

  Elapsed times and IRC ratings are ISORA's (the Class 2 boat started half
  an hour earlier; her elapsed time is from her own gun). Every expected
  number is the one ISORA published in the Welsh Coastal Series table.

series:
  discardThresholds: []
  dnfScoring: seriesEntries
  pointsSystem: highPoint
  highPointFormula: chips3
  scoringCodes:
    - { code: DNF, kind: replace, rule: { type: fixedPoints, points: 10 }, discardable: true }

fleet:
  scoringSystem: irc

