description: "Penalties under CHIPS3 — a 20-boat race at ISORA's 1.1 weight"
notes: |
  A made-up race the size and weight of ISORA's 2026 race 06O1: 20 boats,
  weight 1.1, DNF a fixed 15. Every boat rates 1.000, so the elapsed times
  are the corrected times and Boat 3 is 3rd.

  RRS 44.3(c)'s default penalty is 20% of the DNF score. In low point that
  score is a place, the one after the last, so in high point the penalty is
  taken in places: 20% of place 21 = 4.2 places. With 20 boats a place is
  worth 4.567 CHIPS3 points (99.363 for 1st, 94.796 for 2nd, and so on
  down), so the penalty is 4.2 × 4.567 = 19.182 points. The race's weight
  is applied after the penalty and the score rounded once.

  Boat 3 takes a scoring penalty (SCP, the default 20%). CHIPS3(3, 20) =
  90.229; less 19.182 = 71.046, what place 7.2 would score; × 1.1 = 78.2.
  Boat 7, who finished behind her, keeps her 79.2: nobody moves up.

  Boat 6 is given a discretionary penalty of 10 points: 76.527 − 10 =
  66.527; × 1.1 = 73.2.

  Boat 19 was caught by flag Z (ZFP, 20%). 17.154 − 19.182 would be below
  zero; a penalty can't take her below what DNF scores, 15; × 1.1 = 16.5.

  Boat 20, last, also takes a scoring penalty. She already scores less than
  a DNF (12.586 against 15 — ISORA's fixed DNF beats the last of 18 or more
  finishers), so the penalty has nothing left to take, and the cap doesn't
  lift her to 15 either: 12.586 × 1.1 = 13.8.

