description: "CHIPS3 with a tie on corrected time — ISORA 2024, race 03CI2"
notes: |
  Aurelia and Rockabill VI both correct to 2:27:00 (8251 s × 1.069 and
  8416 s × 1.048, each 8820 s to the second), so they share 1st and 2nd.
  Eight boats finished: n = 8. The tie averages the unrounded points for
  the two places, (CHIPS3(1, 8) + CHIPS3(2, 8)) / 2 = (95.54 + 86.86) / 2 =
  91.20, then the race's weight of 0.8 applies once: 72.96, rounded to 73.0
  each, as ISORA published.

  Elapsed times and IRC ratings are ISORA's; every expected number is the
  one ISORA published in the Irish Coastal Series table.

