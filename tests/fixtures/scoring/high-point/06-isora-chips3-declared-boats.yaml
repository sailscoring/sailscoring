description: "CHIPS3 with declared boats in the fleet size — ISORA 2026, race 01CW1"
notes: |
  ISORA's 2026 notice of race counts every boat that declared it would race
  in the fleet size, and scores one that declared and didn't race DTP, a
  fixed 8 points. Five finishers and two DTPs make n = 7.

  The race is weighted 0.7. Pata Negra wins on corrected time:
  CHIPS3(1, 7) = 94.75, × 0.7 = 66.33, rounded once to 66.3. The DTPs score
  8 × 0.7 = 5.6. Rounding CHIPS3 to 94.8 before weighting would give 66.4.

  Elapsed times and IRC ratings are ISORA's; every expected number is the
  one ISORA published in the Wolf's Head (all IRC classes) table.

series:
  discardThresholds: []
  dnfScoring: seriesEntries
  pointsSystem: highPoint
  highPointFormula: chips3
  scoringCodes:
    - { code: DNF, kind: replace, rule: { type: fixedPoints, points: 15 }, discardable: true }
    - { code: DTP, description: "Declared to race, did not race (NoR 13.2)", kind: replace, rule: { type: fixedPoints, points: 8 }, discardable: true, countsInFleetSize: true }

fleet:
  scoringSystem: irc

competitors:
  - { sailNumber: "GBR 4669", name: "Pata Negra", ircTcc: 1.149 }
  - { sailNumber: "GBR 4933R", name: "Darling XX", ircTcc: 1.003 }
  - { sailNumber: "GBR 9700X", name: "Jac Y Do", ircTcc: 0.959 }
  - { sailNumber: "GBR 6939R", name: "Finally", ircTcc: 1.019 }
  - { sailNumber: "GBR7664T", name: "Crackajack", ircTcc: 1.013 }
  - { sailNumber: "GBR8992R", name: "Lightning", ircTcc: 1.074 }
  - { sailNumber: "GBR 5608L", name: "Excession", ircTcc: 1.047 }

races:
