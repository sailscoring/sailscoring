      - { sailor: "GBR 6939R", elapsed: "3:51:32" }
      - { sailor: "GBR7664T", elapsed: "4:08:59" }
      - { sailor: "GBR8992R", code: DTP }
      - { sailor: "GBR 5608L", code: DTP }

