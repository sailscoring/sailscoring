description: "Boats beaten without the start point, DNS fixed at 1 — Bray SC Winter Series 2023/24, race 1"
notes: |
  Bray's Sailwave-era scoring system, "Bray Sailing Club": n + 1 − place,
  with DNS, DNF and RET changed to score a fixed 1 point. Six finishers and
  five DNS: every DNS came to the start, so n = 11, the winner scores 11 and
  6th scores 6. Every number below is Sailwave's.

series:
  discardThresholds: []
  dnfScoring: seriesEntries
  pointsSystem: highPoint
  highPointFormula: boatsBeaten
  scoringCodes:
    - { code: DNS, kind: replace, rule: { type: fixedPoints, points: 1 }, discardable: true }
    - { code: DNF, kind: replace, rule: { type: fixedPoints, points: 1 }, discardable: true }
    - { code: RET, kind: replace, rule: { type: fixedPoints, points: 1 }, discardable: true }

