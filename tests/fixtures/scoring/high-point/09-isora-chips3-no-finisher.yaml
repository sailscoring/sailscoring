description: "CHIPS3 — a race nobody finished still counts, ISORA 2026, race 09O4"
notes: |
  Race 09O4, Douglas to Dun Laoghaire, was sailed by none of the boats that
  declared for it: ISORA scored every one of them DTP, 8 points × the race's
  weight of 1.2 = 9.6 each, and counted the race among the 18 sailed.

  A low-point series strikes a race nobody finished. In high point a race
  counts for a fleet once one of its boats has a result that counts toward
  the fleet size, and DTP does. A race abandoned outright has no results,
  so it is still struck.

  Every expected number is the one ISORA published in the Wolf's Head (all
  IRC classes) table.

series:
  discardThresholds: []
  dnfScoring: seriesEntries
  pointsSystem: highPoint
  highPointFormula: chips3
  scoringCodes:
    - { code: DNF, kind: replace, rule: { type: fixedPoints, points: 15 }, discardable: true }
    - { code: DTP, description: "Declared to race, did not race (NoR 13.2)", kind: replace, rule: { type: fixedPoints, points: 8 }, discardable: true, countsInFleetSize: true }

fleet:
  scoringSystem: irc

