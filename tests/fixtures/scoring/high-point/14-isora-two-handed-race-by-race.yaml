description: "CHIPS3 in a two-handed division boats join race by race — ISORA 2026, Two-Handed, 18 races, best 5 count"
rrs_notes: >
  ISORA NoR 5.9 and 7.3: the Two-Handed class is a division within IRC, and a
  boat races in it for the races it sails two-handed. A race sailed crewed is
  not a Two-Handed race for the boat: it takes no place in it and is not one
  of the boats in it, so it scores 0 there, as a boat that didn't come does.
notes: |
  ISORA's 2026 Two-Handed table: six boats over the season's 18 races, scored
  CHIPS3 for the boats in each Two-Handed race, × the race's weight, the best
  five counting, as in the IRC Class 1 season (high-point/10).

  Several of the six sailed some races crewed: Loinnir 07O2, 09O4 and 10O5;
  Hijacker 06O1, 07O2, 8O3, 09O4, 11CI3 and 13O6; Paradox 04CI2, 06O1, 09O4
  and 10O5; Blacksheep 04CI2, 15CI4 and 17CI5N; No Xcuse 8O3, 09O4 and 15CI4.
  Each of those finishes is recorded once, from ISORA's overall table, and
  the boat is out of Two-Handed for the race. Left in, each would be placed
  in the Two-Handed race, changing n and every two-handed boat's points.
  Only the Two-Handed fleet is scored here; in the series the same finishes
  also score in Overall and the boat's class.

  ISORA keeps a second record for each two-handed boat (a Sailwave alias),
  and in two races the two records disagree. In 05CW3 Paradox is DTP in the
  two-handed record and has no result at all in the overall one. In 14O7 the
  two-handed records measure from an 08:00 start and the overall ones from
  07:30, so Hijacker's elapsed time differs by half an hour, and Paradox,
  DTP in the two-handed record, finished in the overall one. One record per
  boat can't hold both; this fixture follows the two-handed records, so it
  reproduces ISORA's Two-Handed table.

  Ratings are ISORA's per race, as per-race overrides where they changed.
  Races 05CW3 and 12CW4 were scored by place and have no start here. Five
  races had no two-handed boat in them (01CW1, 03CW2, 12CW4, 16CW5, and
  09O4, which every two-handed boat sailed crewed), and two more had only a
  crewed one (11CI3, 13O6); they count for no one. ISORA's table has a
  column of DNCs for 01CW1 and 03CW2 and discards them; here they aren't
  races the fleet sailed, so each boat discards two fewer zeros. No total
  changes. Every race score, total, nett and rank is ISORA's.

series:
  discardThresholds: []
  countBest: 5
  dnfScoring: seriesEntries
  pointsSystem: highPoint
  highPointFormula: chips3
  scoringCodes:
    - { code: DNF, kind: replace, rule: { type: fixedPoints, points: 15 }, discardable: true }
    - { code: DTP, description: "Declared to race, did not race (NoR 13.2)", kind: replace, rule: { type: fixedPoints, points: 8 }, discardable: true, countsInFleetSize: true }

