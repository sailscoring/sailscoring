description: "CHIPS3, a whole season — ISORA 2026, IRC Class 1, 18 races, best 5 count"
notes: |
  ISORA's 2026 season for IRC Class 1: 16 boats, 18 races, each weighted,
  and the best five counting. Every race scores CHIPS3 for the boats in the
  fleet's race, × that race's weight, rounded once to a tenth. A boat that
  declared and didn't race is DTP (8 × weight, in the fleet size); a
  retirement a fixed 15 × weight; a boat that didn't come 0.

  The fleet discards its races sailed less five, its lowest scores, the
  earliest race first among equals, and ranks highest first. Race 09O4
  counts although nobody finished it: every boat in it was DTP.

  Elapsed times and IRC ratings are ISORA's, from the by-class tables. A
  boat's rating changed during the season for some boats; each race uses
  the rating ISORA published for it, as a per-race override. Two races
  were scored by place rather than time (05CW3, 12CW4); they have no start
  here, so finishing order decides. ISORA's table lists Finally twice, the
  second entry with nothing but DNCs; it is left out, which changes no
  other boat's score since a DNC is not in the fleet size. Every expected number —
  each race score, discard, total and rank — is the one ISORA published.

series:
  discardThresholds: []
  countBest: 5
  dnfScoring: seriesEntries
  pointsSystem: highPoint
  highPointFormula: chips3
  scoringCodes:
    - { code: DNF, kind: replace, rule: { type: fixedPoints, points: 15 }, discardable: true }
    - { code: DTP, description: "Declared to race, did not race (NoR 13.2)", kind: replace, rule: { type: fixedPoints, points: 8 }, discardable: true, countsInFleetSize: true }

