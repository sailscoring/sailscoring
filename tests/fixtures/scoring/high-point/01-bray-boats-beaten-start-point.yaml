description: "Boats beaten with a point for coming to the start — Bray SC Sunday Dinghy Series 2025, race 4"
notes: |
  Bray Sailing Club's HalSail "HP scoring": 1 point for finishing, 1 for each
  boat beaten, and 1 for coming to the start, so place p scores n + 2 − p.

  n is the boats in the race whose result counts toward the fleet size: the
  seven finishers and the two DNFs, so n = 9. The winner scores 10, 7th
  scores 4, and each DNF the place after the last, 1. The two boats given
  redress are left out of n — no boat beat them. One of them, Chris Allen,
  is here with the average HalSail published (2.7) entered as stated
  points; the other (Patricia Prendiville, 0.2) is left out, because the
  engine leaves two redress scores in one race unresolved. Every number
  below is HalSail's.

  The two DNFs tie on the same score and share 9th.

