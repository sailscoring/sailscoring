description: "Penalties under boats beaten — the mirror of low point"
notes: |
  RRS 44.3(c) makes a penalised boat's score worse by the points stated, or
  by 20% of the DNF score, never worse than DNF, and leaves every other
  boat's score alone. In high point worse is fewer points.

  Ten boats finish, so n = 10 and place p scores 11 − p. In low point the
  DNF score would be the place after the last, 11, and under boats beaten a
  place is a point, so each penalty takes off exactly what low point would
  add.

  Carol, 3rd, was over the line under flag Z: ZFP, 20% of place 11 = 2.2
  places. 8 − 2.2 = 5.8. (Low point: 3 + 2.2 = 5.2, and 11 − 5.2 = 5.8.)

  Eve, 5th, takes a scoring penalty the SIs state as 2.5 points: 6 − 2.5 =
  3.5.

  Grace, 7th, failed to sign out — the series' own code SOP, 2 points:
  4 − 2 = 2.

  Iris, 9th, is given a discretionary penalty of 5 points. She scored 2, and
  a penalty can't take her below what DNF scores, the place after the last:
  0.

  Bob, Dave and the rest keep their scores: nobody moves up.

series:
  discardThresholds: []
  dnfScoring: seriesEntries
  pointsSystem: highPoint
  highPointFormula: boatsBeaten
  scoringCodes:
    - code: SOP
      description: "Failed to sign out (SI 19.1)"
      kind: add
      rule: { type: addPoints, points: 2 }
      discardable: true

competitors:
  - { sailNumber: "1", name: "Alice" }
  - { sailNumber: "2", name: "Bob" }
  - { sailNumber: "3", name: "Carol" }
  - { sailNumber: "4", name: "Dave" }
  - { sailNumber: "5", name: "Eve" }
  - { sailNumber: "6", name: "Finn" }
  - { sailNumber: "7", name: "Grace" }
  - { sailNumber: "8", name: "Hugo" }
  - { sailNumber: "9", name: "Iris" }
  - { sailNumber: "10", name: "Jack" }

races:
  - number: 1
    finishes:
      - { sailor: "1", position: 1 }
      - { sailor: "2", position: 2 }
      - { sailor: "3", position: 3, penaltyCode: ZFP }
      - { sailor: "4", position: 4 }
      - { sailor: "5", position: 5, penaltyCode: SCP, penaltyOverride: 2.5, penaltyInPoints: true }
      - { sailor: "6", position: 6 }
      - { sailor: "7", position: 7, penaltyCode: SOP }
      - { sailor: "8", position: 8 }
      - { sailor: "9", position: 9, penaltyCode: DPI, penaltyOverride: 5 }
      - { sailor: "10", position: 10 }

expected:
