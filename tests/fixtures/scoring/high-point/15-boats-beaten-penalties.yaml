    - { rank: 5, sailor: "6", racePoints: [5], raceCodes: [null], racePenaltyCodes: [null], raceDiscards: [false], totalPoints: 5, netPoints: 5 }
    - { rank: 6, sailor: "5", racePoints: [3.5], raceCodes: [null], racePenaltyCodes: [SCP], raceDiscards: [false], totalPoints: 3.5, netPoints: 3.5 }
