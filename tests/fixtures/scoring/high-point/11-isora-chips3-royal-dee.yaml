description: "CHIPS3 with weighted and unweighted races — ISORA 2025, Royal Dee Offshore Championship"
notes: |
  ISORA's 2025 Royal Dee Offshore Championship: 28 boats in one IRC fleet,
  five races, no discards. Race 12O5 is weighted 1.2; the four Volvo Dún
  Laoghaire Regatta races carry no weight, so count once.

  Every race score here is rounded once, to a tenth, after its weight —
  the race at × 1 included. Sailwave didn't: it kept a race with no weight
  set at full precision, rounding only the weighted one, and summed what it
  stored. Its race cells show the rounded figures, so every race score
  below is ISORA's; but its totals are the sum of the unrounded ones, and 9
  of the 28 differ from the sum of the printed scores by 0.1 or 0.2. The
  expected totals are this engine's: each is the sum of the scores printed
  beside it. No boat changes place.

  Elapsed times and IRC ratings are ISORA's.

series:
  discardThresholds: []
  dnfScoring: seriesEntries
  pointsSystem: highPoint
  highPointFormula: chips3
  scoringCodes:
    - { code: DNF, kind: replace, rule: { type: fixedPoints, points: 10 }, discardable: true }

