description: "Boats beaten, a whole season — Bray SC Winter Series 2025/26, 19 races, one discard"
notes: |
  Bray Sailing Club's dinghy winter series under HalSail's HP scoring
  (n + 2 − place, n the boats in each race that came to the start): 22
  boats, 19 races, each boat's lowest score discarded. The races are
  numbered as Bray numbered them; races 10–12 and 20 were not sailed.

  A boat that did not come scores 0, so most discards are a DNC, and among
  equal scores the earliest race goes: Colbert Byrne discards race 1, not
  any of his five other DNCs. The standings run highest first.

  Every number below is HalSail's: the race tables give each boat's place
  and code, and the summary gives her race scores, the discard and her
  total, with one exception below. HalSail doesn't say from how many races
  the discard applies; one discard from five races reproduces it.

  The exception is the order of two three-way ties. RRS A8.1 lists each
  boat's counted scores best to worst — in high point the best is the
  highest — and the first difference decides. On 20: Viv Kelly (194644R,
  best 8) ranks ahead of 1605 (best 7) and Gareth Keenan (170857_FR, best
  5). On 8: 213508 (8), then 11554 (6), then 157255_47 (4). Those are the
  orders ranked here, and the rule ISORA's Sailwave results follow. HalSail
  ranked both ties the other way round: it compares the scores lowest
  first, so the boat with more races scored ahead of 0 wins — not
  countback, which would have put 213508 first.

