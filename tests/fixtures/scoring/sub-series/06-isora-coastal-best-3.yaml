description: "Sub-series counting their best 3 inside a best-5 season — ISORA 2026, IRC Class 1, Irish and Welsh Coastal"
rrs_notes: >
  RRS A2.1, changed by ISORA's race schedule: the Wolf's Head season counts
  the best 5 races, the Irish and Welsh Coastal Series the best 3.
notes: |
  ISORA's 2026 IRC Class 1 season: the 18 races of the season fixture
  (high-point/10), scored CHIPS3 for the boats in each race, × the race's
  weight, the season counting its best 5. Two sub-series state their own
  rule: the Irish Coastal Series (races 02CI1, 04CI2, 11CI3, 15CI4, 17CI5N)
  and the Welsh Coastal Series (01CW1, 03CW2, 05CW3, 12CW4, 16CW5) each
  count their best 3, so a boat that sailed all five drops two. Taking the
  season's rule they would count all five and drop nothing.

  ISORA scores each coastal series in its own Sailwave file. A sub-series is
  scored from the season's races instead, so the two can't drift.

  Irish Coastal reproduces ISORA's table exactly: every race score, discard,
  total and rank. The file lists ten of the class's boats, leaving out the
  five that sailed no Irish race; they are excluded from the sub-series to
  match. Equal scores go earliest race first: D-Tox's DNCs in 02CI1 and
  04CI2 are discarded, those in 15CI4 and 17CI5N counted.

  Welsh Coastal differs from ISORA's table in one race. The Welsh file
  weights 16CW5 at 0.9, where the season file, the race schedule and the
  race's SI all say 0.7. Scored once, at 0.7, Finally's 16CW5 is 61.7 (ISORA's
  Welsh table: 79.4) and Crackajack's 52.2 (67.1). Finally then counts its
  three 63s for 189.0 (205.4), and Crackajack discards 16CW5 in place of
  01CW1 for 168.7 (181.6). The order is unchanged. Every other number is
  ISORA's. The Welsh file lists Finally twice, the second entry with nothing
  but DNCs; as in the season fixture it is left out. The twelve boats that
  sailed no Welsh race share 4th on 0.

subSeriesConfig:
  - name: "Irish Coastal"
    discards: { kind: countBest, countBest: 3 }
    excludeCompetitors: ["GBR 6939R", "GBR7664T", "GBR 5608L", "GBR 9496T", "GBR"]
  - name: "Welsh Coastal"
    discards: { kind: countBest, countBest: 3 }

series:
  discardThresholds: []
  countBest: 5
  dnfScoring: seriesEntries
  pointsSystem: highPoint
  highPointFormula: chips3
  scoringCodes:
    - { code: DNF, kind: replace, rule: { type: fixedPoints, points: 15 }, discardable: true }
    - { code: DTP, description: "Declared to race, did not race (NoR 13.2)", kind: replace, rule: { type: fixedPoints, points: 8 }, discardable: true, countsInFleetSize: true }

