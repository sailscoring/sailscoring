description: "Sub-series with their own discards — best 3 in a best-5 season, and a no-discard points table"
rrs_notes: >
  RRS A2.1 — the sailing instructions may change the number of races excluded
  from a boat's series score, and they may say so table by table: ISORA's
  season counts the best 5 results, its coastal series the best 3, and its
  Points Series every race.
notes: |
  A seven-race season counting its best 5, with two sub-series stating their
  own discards. Coastal is races 1–5 and counts its best 3. Points is every
  race and counts them all.

  Taking the series' rule, Coastal would count its best 5 of 5 and discard
  nothing: Brian (11) would beat Ciara (13). Counting the best 3, each boat
  drops its two worst. Ciara drops her two 4s and Brian his two 3s, and they
  tie on 5. RRS A8.1 compares their counted scores best first: Ciara's
  1, 1, 3 beat Brian's 1, 2, 2 at the second, so Ciara is 2nd.

  Equal scores: the earliest race goes first. Dara's three 4s in Coastal leave
  races 1 and 3 discarded and race 4 counting.

  The season itself (best 5 of 7) is checked too: each boat discards two.
  Points totals every race with nothing discarded.

series:
  discardThresholds: []
  countBest: 5
  dnfScoring: seriesEntries

subSeriesConfig:
  - name: "Coastal"
    discards: { kind: countBest, countBest: 3 }
  - name: "Points"
    discards: { kind: none }

