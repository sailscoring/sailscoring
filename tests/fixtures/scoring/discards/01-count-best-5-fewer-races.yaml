description: "Count the best 5 — a fleet that sails fewer races than the series (ISORA 2026)"
rrs_notes: >
  RRS A2.1 — the sailing instructions may change the number of races excluded
  from a boat's series score. ISORA's say how many count instead: "the best 5
  results out of all sailed races".
notes: |
  ISORA's 2026 season: 18 races, the best 5 counting. The Two-Handed fleet had
  no start in races 9, 11, 12, 13 and 16. Those races are not its races, so
  they earn it no discards: the rule is worked out per fleet, from the races
  that fleet sailed, as Sailwave does. ISORA's Two-Handed table shows 8
  discards per boat, not the 13 its series-wide caption implies.

  The Two-Handed boats are ISORA's, with their place in each race the order
  of the points ISORA published for them. Three IRC boats, Pata Negra,
  ReQuest and Crackajack, sail every race beside them, placed the same way.
  ISORA scores high point, so the points are not ISORA's. Its DTP ("entered
  but did not race") is entered here as DNS, which A5.2 scores the same as a
  DNC.

  Sail Scoring counts a race for a fleet once one of its boats came to the
  start, where Sailwave counts every race whose starts included the fleet.
  No Two-Handed boat came to races 1 or 3, so the fleet is scored over 11
  races with 6 discards, where Sailwave's table has 13 races with 8: the two
  extra discards drop the DNCs every boat has in races 1 and 3, so the nett
  is the same either way. Nobody finished race 9, in ISORA's results as
  here, so it counts for neither fleet, and the IRC fleet has 17 races and
  12 discards.

