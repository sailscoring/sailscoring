description: "Count the best 3 — ISORA's 2025 Welsh Coastal Series, 5 races"
rrs_notes: >
  RRS A2.1 — the sailing instructions may change the number of races excluded
  from a boat's series score. Here they say how many count instead: the best
  3 results of the Welsh Coastal races.
notes: |
  ISORA's 2025 Welsh Coastal Series: 13 boats, five races, the best three
  counting, so with five sailed every boat discards two. The roster and who
  came to which race are ISORA's; a boat's place in each race is the order of
  the points ISORA published for it.

  ISORA scores high point, so the points here are not ISORA's. Its discards
  drop a boat's lowest scores; low point drops the highest, and under A5.2 a
  DNF and a DNC both score 14 where ISORA gives a DNF more than a DNC. Most
  boats still discard the races ISORA discarded.

  Equal scores: the earliest race goes first, as Sailwave does. Mojito has a
  DNC in races 1, 2 and 4 and discards races 1 and 2, keeping race 4's, exactly
  as ISORA's table shows; so do Pata Negra and Gelert. Tormilind, with five
  scores of 14, discards races 1 and 2; ISORA kept her race 1 DNF, which it
  scored above her DNCs.

  Nothing in the series says "5 races". Had ISORA added a sixth Welsh race,
  as a 2024 amendment to its notice of race did, the same rule would discard
  three with no one editing it.

