description: "Excluded competitor — on the list, not an entrant"
rrs_notes: "RRS A5.2 — DNC scores the number of boats entered in the series plus one"
notes: |
  A club roster of five boats is imported; Eoin (9) has not entered, so the
  scorer marks him excluded. He stays on the competitor list but is not an
  entrant: four boats are entered, so a DNC scores 4 + 1 = 5, not 6.

  Eoin sails race 2 anyway and crosses the line second. A non-entrant's
  finish scores nothing and he appears on no table; the boats that crossed
  behind him move up a place — Aoife is 2nd in race 2, not 3rd.

  Dara misses race 1 and scores DNC = 5. Brian and Aoife tie on 3 points
  with identical score lists (1, 2); RRS A8.2 gives Brian the tie for his
  win in the last race.

