description: "Sub-series entry overrides — a boat kept in a block it never sailed, a boat dropped from one block"
rrs_notes: "RRS A5.2 — DNC scores the number of boats entered in the series plus one, per sub-series"
notes: |
  The shape of a club league scored with "rank only boats that took part" on
  every block: six boats entered, and Adrenaline (32032) never comes to the
  start. The automatic rule would drop her from the Division A table and
  make everyone else's DNC 6. But she entered, and the club ranks her: an
  "include" override for the Division A block keeps her on that table with
  DNC in every race (7 + 7 + 7 = 21, 6th) and counts her, so Eala's race-2
  DNC scores 7, not 6 — the club's own published figure.

  The Points block over the same races excludes Puppeteer (1) by override:
  she is scored everywhere else but not there. Adrenaline has no include
  in this block, so the automatic rule leaves her out, and with four
  entrants Eala's race-2 DNC scores 5.

