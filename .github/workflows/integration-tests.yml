name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sailscoring
          POSTGRES_PASSWORD: sailscoring
          POSTGRES_DB: sailscoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sailscoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://sailscoring:sailscoring@localhost:5432/sailscoring
      BETTER_AUTH_SECRET: ci-secret-do-not-use-in-prod-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BILGE_URL: https://bilge.sailscoring.ie

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The canonical-logos assets are gitignored and re-fetched from the
      # pinned GitHub release by `prebuild`. That download is on the critical
      # path of the build Playwright's webServer starts, so a blip at
      # github.com fails the e2e step before a test runs. Cache the assets on
      # the pin: scripts/sync-canonical-logos.ts skips the fetch entirely when
      # public/canonical-logos/.version already matches.
      - name: Cache canonical-logos assets
        uses: actions/cache@v4
        with:
          path: public/canonical-logos
          key: canonical-logos-${{ hashFiles('lib/canonical-logos/dataset-version.txt') }}

      - name: Apply Drizzle migrations
        run: pnpm db:migrate

      - name: Run server-side Vitest suites (schema, repos, auth, api)
        run: pnpm test:unit tests/db tests/postgres-repository.test.ts tests/auth tests/api

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run e2e tests
        run: pnpm run test:e2e
