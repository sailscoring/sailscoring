name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    # The e2e suite twice, side by side: at desktop size, and again at phone
    # size with the phone checks on (e2e/phone-checks.ts). The phone run is
    # `pnpm phone-sheet`, which also captures each page and dialog it reaches
    # and uploads them as the phone-sheet artifact (open index.html), for what
    # the checks can't judge. The server-side Vitest suites don't depend on
    # the screen, so only the desktop job runs them.
    strategy:
      fail-fast: false
      matrix:
        screen: [desktop, mobile]

    name: integration (${{ matrix.screen }})

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sailscoring
          POSTGRES_PASSWORD: sailscoring
          POSTGRES_DB: sailscoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sailscoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://sailscoring:sailscoring@localhost:5432/sailscoring
      BETTER_AUTH_SECRET: ci-secret-do-not-use-in-prod-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BILGE_URL: https://bilge.sailscoring.ie

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The canonical-logos assets are gitignored and re-fetched from the
      # pinned GitHub release by `prebuild`. That download is on the critical
      # path of the build Playwright's webServer starts, so a blip at
      # github.com fails the e2e step before a test runs. Cache the assets on
      # the pin: scripts/sync-canonical-logos.ts skips the fetch entirely when
      # public/canonical-logos/.version already matches.
      - name: Cache canonical-logos assets
        uses: actions/cache@v4
        with:
          path: public/canonical-logos
          key: canonical-logos-${{ hashFiles('lib/canonical-logos/dataset-version.txt') }}

      - name: Apply Drizzle migrations
        run: pnpm db:migrate

      - name: Run server-side Vitest suites (schema, repos, auth, api)
        if: matrix.screen == 'desktop'
        run: pnpm test:unit tests/db tests/postgres-repository.test.ts tests/auth tests/api

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run e2e tests
        run: pnpm run ${{ matrix.screen == 'mobile' && 'phone-sheet' || 'test:e2e' }}

      # Uploaded whatever the suite's result: a failing phone check is when
      # the sheet is most worth a look.
      - name: Upload the phone sheet
        if: always() && matrix.screen == 'mobile'
        uses: actions/upload-artifact@v4
        with:
          name: phone-sheet
          path: screenshots/phone/
          if-no-files-found: ignore
          retention-days: 14
