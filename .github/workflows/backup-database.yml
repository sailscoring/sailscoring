name: Database backup

# The run title in the Actions UI, so weekly and daily runs are told apart at
# a glance instead of by opening the log. This is the third place the weekly
# cron literal appears (`cron:` below and the dump step are the others) and
# the only visible one: a run titled "Daily" on a Sunday means the literals
# have drifted apart, which is the failure the dump step's comment warns of.
run-name: >-
  ${{ (github.event.schedule == '40 5 * * 0' || inputs.full)
      && 'Weekly backup (full dump)'
      || 'Daily backup (no archive rows)' }}

on:
  schedule:
    # Daily, without the as-published archive rows (see ARCHIVE_TABLE below).
    #
    # Both crons sit off the top of the hour on purpose. GitHub's scheduled
    # queue is best-effort and :00 is where nearly everyone's cron lands: over
    # 114 runs from `0 6 * * *`, not one started within 15 minutes of its slot
    # — median 2.5h late, 90th percentile 4.1h, worst 11.2h. Odd minutes are
    # not a fix, only a smaller queue to be stuck in; see the runbook.
    - cron: '23 6 * * *'
    # Weekly, everything.
    - cron: '40 5 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: 'Include the as-published archive data (a weekly-style full dump)'
        type: boolean
        default: false

permissions:
  id-token: write   # required for AWS OIDC federation
  contents: read

concurrency:
  group: backup-database
  cancel-in-progress: false

env:
  # Reproducible from the per-class archive repos (ADR-010): ingested as
  # published, never re-scored. Its rows are excluded from the daily dump —
  # they were over half of every dump's on-the-wire bytes — and captured by
  # the weekly run instead. Data only: the table definition stays in every
  # dump, so a daily-dump restore yields a complete, working schema with this
  # one table empty. Using -T here instead would omit the table entirely and
  # the restored database would not run.
  ARCHIVE_TABLE: public.as_published_results

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Postgres 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # Ubuntu runners ship postgresql-client-16, and /usr/bin/pg_dump is a
          # pg_wrapper that resolves to the older binary. Put v17 first on PATH
          # for subsequent steps; the explicit absolute-path call below also
          # fails fast if the v17 binary somehow isn't there.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKUP_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Dump and upload
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BUCKET: ${{ vars.AWS_BACKUP_BUCKET }}
          SCHEDULE: ${{ github.event.schedule }}
          FULL_INPUT: ${{ inputs.full }}
        run: |
          set -euo pipefail

          # Weekly cron or an explicitly-requested manual run dumps everything;
          # anything else is a daily. The literal below must match the weekly
          # `cron:` above and the one in `run-name:` exactly — change one and
          # you must change the others, or every weekly run silently becomes a
          # daily and the archive rows stop being backed up at all.
          if [ "$SCHEDULE" = '40 5 * * 0' ] || [ "$FULL_INPUT" = 'true' ]; then
            PREFIX=weekly
            EXCLUDE=()
          else
            PREFIX=daily
            EXCLUDE=(--exclude-table-data="$ARCHIVE_TABLE")
          fi

          DATE=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          DAY=$(date -u +%Y/%m/%d)
          KEY="${PREFIX}/${DAY}/sailscoring-${DATE}.dump"
          DUMP="${RUNNER_TEMP}/sailscoring.dump"
          # Dump to a local file before uploading so a pg_dump failure can
          # never leave a partial / empty object behind in the bucket.
          # Streaming via | aws s3 cp - races: the upload often completes with
          # what the pipe delivered (potentially zero bytes) before pipefail
          # surfaces the upstream error, and the bad object is then locked
          # under compliance retention for the lock window.
          pg_dump \
            --format=custom \
            --no-owner --no-privileges \
            --verbose \
            "${EXCLUDE[@]}" \
            --file="$DUMP" \
            "$DATABASE_URL"
          aws s3 cp "$DUMP" "s3://${BUCKET}/${KEY}"
          echo "::notice::Uploaded s3://${BUCKET}/${KEY} ($(stat -c%s "$DUMP") bytes, ${PREFIX})"
